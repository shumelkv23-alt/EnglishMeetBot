[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    e2e: сквозные тесты против поднятого uvicorn (HTTP + БД)
    live: тесты, реально обращающиеся к Google Chat API / OpenRouter
addopts = -m "not e2e and not live"
