
services:
  db:
    image: postgres:15-alpine
    container_name: meet_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: meet_bot_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db 
      APP_ENV: production
      LOG_LEVEL: INFO
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm.azati.ai}
      LLM_GAMES_MODEL: ${LLM_GAMES_MODEL:-Azati Fast}
      LLM_CARDS_MODEL: ${LLM_CARDS_MODEL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
