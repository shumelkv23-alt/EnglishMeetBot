services:
  db:
    image: postgres:15-alpine
    container_name: meet_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем: БД доступна только внутри docker-сети.

  app:
    build: .
    container_name: meet_bot_app
    restart: always
    env_file: .env               # Google Chat / LLM / timezone / audience — всё из .env
    environment:
      DB_HOST: db                # внутри сети ходим на сервис db
      DB_PORT: "5432"
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Секрет монтируем, а не запекаем в образ (sa-key.json НЕ коммитить).
      - ./sa-key.json:/app/sa-key.json:ro
    # Порт наружу не публикуем: до app ходит только Caddy.

  caddy:
    image: caddy:2
    container_name: meet_bot_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
