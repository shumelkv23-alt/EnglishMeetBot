
services:
  db:
    image: postgres:15-alpine
    container_name: meet_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: meet_bot_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      APP_ENV: production
      LOG_LEVEL: INFO
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CHAT_APP_AUDIENCE: ${CHAT_APP_AUDIENCE}
      SKIP_JWT_VALIDATION: ${SKIP_JWT_VALIDATION}
      GOOGLE_SA_KEY_FILE: ${GOOGLE_SA_KEY_FILE}
      CHAT_TEST_SPACE: ${CHAT_TEST_SPACE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
    volumes:
      - ./sa-key.json:/app/sa-key.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: